<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drzewo rodzinne</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f3ee; color: #2a2a2a; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    form { background: #fff; padding: 28px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.08); width: min(340px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0; font-size: 20px; }
    input { font: inherit; padding: 9px 11px; border: 1px solid #cfcac0; border-radius: 8px; }
    button { font: inherit; padding: 9px 12px; border: 0; border-radius: 8px; background: #2f7a5a; color: #fff; cursor: pointer; }
    .error { margin: 0; color: #b3261e; min-height: 1.4em; }
  </style>
</head>
<body>
  <form id="login">
    <h1>Drzewo rodzinne</h1>
    <input name="haslo" type="password" placeholder="Hasło" autocomplete="current-password" required autofocus>
    <button type="submit">Wejdź</button>
    <p class="error" id="error"></p>
  </form>
  <script>
    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const haslo = e.target.haslo.value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ haslo }),
      });
      if (res.ok) {
        location.reload();
      } else {
        document.getElementById('error').textContent = 'Złe hasło. Spróbuj jeszcze raz.';
      }
    });
  </script>
</body>
</html>
